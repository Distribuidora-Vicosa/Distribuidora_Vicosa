<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Panel · Distribuidora Vicosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#96488b;--pd:#7a3671;--pink:#ecd5e3;--lav:#e4d0e1;--bg:#fafafa;--ink:#1a1217;--ease:cubic-bezier(.22,1,.36,1)}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:.92rem}
h1,h2,h3{font-family:Oswald,sans-serif;font-weight:500;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.b{background:var(--p);color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:.85rem;transition:background .25s,transform .25s var(--ease)}
.b:hover{background:var(--pd)}.b:active{transform:scale(.96)}.b.o{background:#fff;color:var(--p);border:1.5px solid var(--p)}.b.o:hover{background:var(--lav)}.b.d{background:#b3261e}.b.s{padding:6px 12px;font-size:.78rem}
input,select,textarea{border:1.5px solid var(--lav);border-radius:12px;padding:9px 12px;background:#fff;width:100%;transition:border-color .25s,box-shadow .25s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(150,72,139,.14)}
input[type=checkbox]{width:auto;accent-color:var(--p);transform:scale(1.2)}
label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:500;color:#5b4a56}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--pink),var(--lav))}
#login form{background:#fff;padding:34px;border-radius:26px;width:min(400px,92vw);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(80,30,70,.2)}
#login h1{color:var(--p);font-size:1.8rem}
.top{background:var(--p);color:#fff;padding:0 22px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:20;overflow-x:auto}
.top h2{margin-right:18px;white-space:nowrap;font-size:1.25rem}
.top button{background:none;border:0;color:#ffffffcc;padding:18px 14px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.top button.on{color:#fff;border-color:#fff}.top .sp{flex:1}
.dot{background:#fff;color:var(--p);border-radius:10px;font-size:.7rem;padding:1px 7px;margin-left:6px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:24px 18px 70px;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.tb input,.tb select{width:auto;min-width:160px}.tb .gr{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.k{background:#fff;border:1px solid var(--lav);border-radius:18px;padding:14px 16px}.k small{color:#7b6a76}.k b{display:block;font:500 1.6rem Oswald;color:var(--p)}
.card{background:#fff;border:1px solid var(--lav);border-radius:18px;padding:0;margin-bottom:10px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:90px 1fr auto auto;gap:12px;align-items:center;padding:14px 18px}
.card>summary::-webkit-details-marker{display:none}.card[open]>summary{background:var(--bg)}
.det{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--lav)}
@media(max-width:760px){.det{grid-template-columns:1fr}.card>summary{grid-template-columns:1fr auto}}
.badge{font-size:.72rem;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--lav);color:var(--pd)}
.s-nuevo{background:var(--p);color:#fff}.s-entregado{background:#d9efe0;color:#1c6b3a}.s-cancelado{background:#eee;color:#777}.s-enviado{background:#dbe7f7;color:#254f8f}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--lav)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #f1e6ef;vertical-align:middle}th{background:var(--bg);font-size:.75rem;color:#7b6a76;font-weight:600}
td input{padding:6px 8px;border-radius:9px}.tw{overflow-x:auto;border-radius:18px}
.th{width:44px;height:44px;border-radius:10px;background:var(--lav);object-fit:contain}
.off{opacity:.5}.mut{color:#7b6a76;font-size:.8rem}
dialog{border:0;border-radius:24px;padding:26px;width:min(560px,94vw);box-shadow:0 30px 80px rgba(40,10,36,.4)}dialog::backdrop{background:rgba(40,10,36,.5)}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:12px}dialog .f{grid-column:1/-1}dialog h3{margin-bottom:6px;grid-column:1/-1;color:var(--p);font-size:1.4rem}
.ch{display:flex;gap:18px;align-items:center}.ch label{flex-direction:row;align-items:center;gap:8px;font-size:.88rem}
#tt{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;opacity:0;transition:.4s var(--ease);z-index:99;pointer-events:none}
#tt.on{opacity:1;transform:translate(-50%,0)}#tt.er{background:#b3261e}
.set{display:grid;gap:16px;max-width:680px}.pre{background:#fff;border:1px solid var(--lav);border-radius:14px;padding:12px;font:.78rem/1.5 ui-monospace,monospace;overflow-x:auto;white-space:pre-wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px;margin-bottom:10px}
.pcard{background:#fff;border:1px solid var(--lav);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:5px;transition:transform .35s var(--ease),box-shadow .35s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(80,30,70,.14)}.pcard.off{opacity:.55}.pcard.off:hover{opacity:1}
.pimg{aspect-ratio:1;border-radius:16px;background:linear-gradient(160deg,var(--pink),var(--lav));overflow:hidden;position:relative;display:grid;place-items:center}
.pimg img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.pimg i{font-style:normal;font-size:2rem;opacity:.35}
.tag{position:absolute;top:8px;left:8px;font-size:.64rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--ink);color:#fff;letter-spacing:.04em}.tag.r{left:auto;right:8px;background:#fff;color:var(--p)}.tag.g{background:#777}
.pcard h4,.ccard h4{margin:4px 2px 0;font-size:.92rem;font-weight:600;line-height:1.25}.pd{margin:0 2px;color:#7b6a76;font-size:.78rem}
.pr{padding:0 2px;color:var(--p);font:500 1.15rem Oswald,sans-serif}.qp{border:0;border-bottom:1.5px dashed var(--lav);border-radius:0;padding:1px 0;width:92px;font:500 1.1rem Oswald,sans-serif;color:var(--p);background:transparent}
.qp:focus{box-shadow:none;border-bottom-color:var(--p)}
.pact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}.pact .b.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sech{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}.sech h3{font-size:1.25rem;color:var(--pd)}
.seg{display:flex;gap:6px}.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ccard{background:#fff;border:1px solid var(--lav);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .35s var(--ease),box-shadow .35s}.ccard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(80,30,70,.14)}.ccard.off{opacity:.55}
.thm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}.thm div{aspect-ratio:1;border-radius:10px;background:var(--lav);overflow:hidden}.thm img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
details.sg{background:#fff;border:1px solid var(--lav);border-radius:20px;margin-bottom:12px;overflow:hidden}details.sg>summary{cursor:pointer;padding:16px 20px;font:500 1.2rem Oswald,sans-serif;color:var(--pd);list-style:none;display:flex;justify-content:space-between}
details.sg>summary::-webkit-details-marker{display:none}details.sg>summary:after{content:"＋";color:var(--p)}details.sg[open]>summary:after{content:"－"}
.ss{padding:6px 20px 18px;border-top:1px solid var(--lav)}.ssh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 8px;padding:8px 12px;background:var(--bg);border-radius:12px;font-weight:600;font-size:.86rem}
.ssh label{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:.8rem}
.fld{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:start;padding:7px 0}.fld .fl{font-size:.76rem;color:#7b6a76;padding-top:10px}.fld.mod .fl{color:var(--p);font-weight:600}.fld textarea{resize:vertical}
.fld.img{grid-template-columns:96px 1fr}.th2{width:96px;height:96px;border-radius:14px;background:var(--lav);overflow:hidden}.th2 img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.chk{flex-direction:row;align-items:center;gap:8px}.tb input[type=checkbox]{min-width:0}
@media(max-width:700px){.fld{grid-template-columns:1fr}.fld .fl{padding-top:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login"><form id="lf"><h1>Panel Vicosa</h1><p class="mut" style="margin:0">Acceso para administradores</p>
<label>Correo<input name="e" type="email" required autocomplete="username"></label><label>Contraseña<input name="p" type="password" required autocomplete="current-password"></label>
<p id="le" style="color:#b3261e;margin:0;font-size:.85rem"></p><button class="b" type="submit">Ingresar</button></form></div>
<div id="app" hidden><nav class="top"><h2>Vicosa · Panel</h2>
<button data-t="orders">Pedidos<span class="dot" id="nb" hidden>0</span></button><button data-t="products">Productos</button><button data-t="cats">Categorías</button><button data-t="site">Sitio</button><button data-t="settings">Ajustes</button><button data-t="users">Clientes</button>
<span class="sp"></span><a href="index.html" target="_blank" style="color:#fff;font-size:.82rem;margin-right:14px">Ver sitio ↗</a><button id="out">Salir</button></nav>
<main id="main"></main></div>
<dialog id="md"><form id="mf"></form></dialog><div id="tt"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="cms-map.js"></script><script src="admin.js"></script>
</body></html>
